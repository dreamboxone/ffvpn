name: Build OpenWrt releases
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed release after successful builds
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
concurrency:
  group: ffvpn-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - name: Check scripts and interfaces
        run: python3 test/check.py
      - name: Test core behavior
        working-directory: core
        run: go test ./cmd/ffvpn ./internal/service ./internal/proxy ./internal/accounts ./internal/config ./internal/fxa
      - name: Test differential block compatibility
        run: |
          sh build/core.sh x86_64 dist/ffvpn-core
          python3 test/chunks.py dist/ffvpn-core
  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: armv7
            architectures: 'arm_cortex-a7_neon-vfpv4 arm_cortex-a7 arm_cortex-a7_vfpv4 arm_cortex-a5_vfpv4 arm_cortex-a8_vfpv3 arm_cortex-a9 arm_cortex-a9_neon arm_cortex-a9_vfpv3-d16 arm_cortex-a15_neon-vfpv4'
          - family: armv6
            architectures: 'arm_arm1176jzf-s_vfp'
          - family: armv5
            architectures: 'arm_arm926ej-s arm_xscale'
          - family: arm64
            architectures: 'aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic'
          - family: mipsle
            architectures: 'mipsel_24kc mipsel_74kc mipsel_mips32'
          - family: mips
            architectures: 'mips_24kc mips_4kec mips_mips32'
          - family: mips64
            architectures: 'mips64_octeonplus mips64_mips64r2'
          - family: mips64le
            architectures: 'mips64el_mips64r2'
          - family: amd64
            architectures: 'x86_64'
          - family: i386
            architectures: 'i386_pentium4'
          - family: riscv64
            architectures: 'riscv64_riscv64'
          - family: loong64
            architectures: 'loongarch64_generic'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - name: Build architecture family
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
        run: |
          set -eu
          set -- $ARCHITECTURES
          sh build/core.sh "$1" dist/core
          for arch in "$@"; do
            python3 build/release.py --binary dist/core --out dist/release --arch "$arch" --manifest-only
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ffvpn-${{ matrix.family }}
          path: |
            dist/release/*.manifest
            dist/release/*.gz
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ffvpn-*
          merge-multiple: true
          path: dist/release
      - name: Build pinned signature tool
        run: |
          git clone https://git.openwrt.org/project/usign.git "$RUNNER_TEMP/usign"
          git -C "$RUNNER_TEMP/usign" checkout c4c72b1b07945ee192361dc751291a7c98d6adcd
          cmake -S "$RUNNER_TEMP/usign" -B "$RUNNER_TEMP/usign/build"
          cmake --build "$RUNNER_TEMP/usign/build" --parallel 2
      - name: Prepare official OpenWrt APK tool
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot
          sdk=openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl --fail --location --retry 5 "https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/$sdk" -o "$RUNNER_TEMP/sdk.tar.zst"
          echo "9f371906ce6d2f95418f69fac06df58bf9df0ffc4abed6206c30f1b547fcfc12  $RUNNER_TEMP/sdk.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk" --version
      - name: Verify and sign release assets
        env:
          SIGNING_KEY_B64: ${{ secrets.FFVPN_RELEASE_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_B64" || { echo 'Release signing secret is missing'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/ffvpn-release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$key"
          python3 build/publish.py --assets dist/release --usign "$RUNNER_TEMP/usign/build/usign" --key "$key" --apk "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"
      - name: Publish release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 build/upload.py --assets dist/release
